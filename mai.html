<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f5f1;
            color: #333;
        }
        header {
            background-color: #f8bbd0;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
        }
        main {
            padding: 20px;
            text-align: center;
        }
        .medal-image {
            max-width: 200px;
            border-radius: 10px;
            margin: 20px auto;
        }
        .content-section {
            margin: 20px 0;
            padding: 20px;
            background-color: #ffecf0;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .question-link {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            background-color: #8e24aa;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .question-link:hover {
            background-color: #6a1b9a;
        }
        footer {
            background-color: #f48fb1;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Congratulations, Somanorani Ningthoujam!</h1>
    </header>
    <main>
        <img class="medal-image" src="soma.jpg" alt="Gold Medal">
        <div class="content-section">
            <p>You did it! Winning a gold medal in Environmental Science for your Master’s degree is a fantastic achievement. Your dedication and hard work are truly inspiring!</p>
        </div>
        <div class="content-section">
            <h2>Here’s a virtual flower to celebrate your success!</h2>
            <img class="medal-image" src="flowers.jpg" alt="Virtual Flower">
        </div>
    </main>
    <footer>
        Made with love for you! | <a href="#">Back to Top</a>
    </footer>
</body>
</html>
